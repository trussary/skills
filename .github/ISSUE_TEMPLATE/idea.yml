name: Idea or feedback
description: A change to an existing skill, grounded in a failure you saw. One change per issue.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        An idea stays open when it clears the bar in [`SCOPE.md`](https://github.com/trussary/skills/blob/main/SCOPE.md): something went wrong in a real session, and the fix helps any project using the workflow. A tweak for one project belongs in that project's `docs/agents/*.md`.
  - type: checkboxes
    id: read-scope
    attributes:
      label: Before filing
      options:
        - label: I've read `SCOPE.md`.
          required: true
        - label: This issue is about one problem.
          required: true
        - label: I searched open and closed issues for a duplicate.
          required: true
  - type: input
    id: skill
    attributes:
      label: Skill
      description: Which existing skill this changes.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What went wrong
      description: The real session where the skill fell short. What you ran, what it did, and why that was a problem. Include harness and model.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: The smallest change that fixes it. Describe it; don't paste a rewritten SKILL.md.
    validations:
      required: true
